name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        run: zip -r "dist/archaeotrench_utilities_${GITHUB_REF_NAME}.zip" archaeotrench_utilities/
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "archaeoTrench Utilities $GITHUB_REF_NAME" \
            --generate-notes \
            "dist/archaeotrench_utilities_${GITHUB_REF_NAME}.zip"
